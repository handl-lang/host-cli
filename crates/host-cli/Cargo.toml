[package]
name = "handl-host-cli"
version.workspace = true
edition.workspace = true
description = "`hnl` — a dumb host that discovers `hnl_ext_*` extensions and dispatches argv to them (ADR-0149)."
license.workspace = true
repository.workspace = true

[[bin]]
name = "hnl"
path = "src/main.rs"

[lib]
name = "handl_host_cli"
path = "src/lib.rs"

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
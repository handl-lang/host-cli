[package]
name = "handl-host-cli"
version.workspace = true
edition.workspace = true
description = "`hnl` CLI internal library surface (enables `cargo test --lib`)."
license.workspace = true
repository.workspace = true

[[bin]]
name = "hnl"
path = "src/main.rs"

[lib]
name = "handl_host_cli"
path = "src/lib.rs"

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/platform" }
handl-runtime = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-lex-pattern = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-parse = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-parse-pratt = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-transform = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-transform-rewrite = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-cli = { path = "../plugin-ext-cli" }
handl-plugin-applier-bootstrap = { git = "https://github.com/handl-lang/platform" }
handl-kit-canonical = { git = "https://github.com/handl-lang/kit-canonical" }
handl-kit-data = { git = "https://github.com/handl-lang/platform" }
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang" }
handl-language = { git = "https://github.com/handl-lang/platform" }
handl-host-tooling = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-fmt = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-lint = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-typecheck = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-test = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-refinement = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-test = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-typecheck = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-fmt = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-sdkgen = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile-js = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile-llvm = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile-handl = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile-term = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile-dot = { git = "https://github.com/handl-lang/platform" }
handl-plugin-compile-sexp = { git = "https://github.com/handl-lang/platform" }
handl-kit-arrow-lower = { git = "https://github.com/handl-lang/platform" }
handl-plugin-ext-compile = { git = "https://github.com/handl-lang/platform" }
serde_json = "1"

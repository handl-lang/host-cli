[package]
name = "handl-host-cli"
version.workspace = true
edition.workspace = true
description = "`hnl` CLI internal library surface (enables `cargo test --lib`)."
license.workspace = true
repository.workspace = true

[[bin]]
name = "hnl"
path = "src/main.rs"

[lib]
name = "handl_host_cli"
path = "src/lib.rs"

# ADR-0128 §0.3: the `hnl` binary's compile-target set is this feature
# list — each enables one repo module's crate plus the matching
# `handl-plugin-ext-compile` feature. `hnl compile <off-target>` reports
# "unsupported target".
[features]
default = ["js", "llvm", "handl", "term", "dot", "sexp"]
js = ["dep:handl-plugin-compile-js", "handl-plugin-ext-compile/js"]
llvm = ["dep:handl-plugin-compile-llvm", "handl-plugin-ext-compile/llvm"]
handl = ["dep:handl-plugin-compile-handl", "handl-plugin-ext-compile/handl"]
term = ["dep:handl-plugin-compile-term", "handl-plugin-ext-compile/term"]
dot = ["dep:handl-plugin-compile-dot", "handl-plugin-ext-compile/dot"]
sexp = ["dep:handl-plugin-compile-sexp", "handl-plugin-ext-compile/sexp"]

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-lex-pattern = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-parse = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-parse-pratt = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-transform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-transform-rewrite = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-cli = { path = "../plugin-ext-cli" }
handl-plugin-applier-bootstrap = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-kit-canonical = { git = "https://github.com/handl-lang/kit-canonical", branch = "main" }
handl-kit-data = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-host-tooling = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-fmt = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-lint = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-typecheck = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-test = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-refinement = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-test = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-typecheck = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-fmt = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-sdkgen = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-compile = { git = "https://github.com/handl-lang/platform", branch = "main" }
# The six compile targets — optional, behind the features above. Their
# git sources are the *target* repos (ADR-0128: the `hnl` binary's target
# set is its dep list); the workspace-root `[patch]` tables resolve the
# sibling checkouts; `pin-git-revs.py` pins them to `rev` at release.
handl-plugin-compile-js = { git = "https://github.com/handl-lang/web", branch = "main", optional = true }
handl-plugin-compile-llvm = { git = "https://github.com/handl-lang/native", branch = "main", optional = true }
handl-plugin-compile-handl = { git = "https://github.com/handl-lang/handl", branch = "main", optional = true }
handl-plugin-compile-term = { git = "https://github.com/handl-lang/term", branch = "main", optional = true }
handl-plugin-compile-dot = { git = "https://github.com/handl-lang/dot", branch = "main", optional = true }
handl-plugin-compile-sexp = { git = "https://github.com/handl-lang/sexp", branch = "main", optional = true }
handl-kit-arrow-lower = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ext-compile = { git = "https://github.com/handl-lang/platform", branch = "main" }
serde_json = "1"

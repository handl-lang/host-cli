[workspace]
resolver = "3"
members = [
  "crates/host-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/host-cli"

# ADR-0128 §Resolution: local development resolves sibling-repo deps from
# sibling checkouts; without the checkouts (or this block), the git sources
# are used. A git source must still resolve — before the remotes exist,
# point them at the local clones:
#
#   CARGO_NET_GIT_FETCH_WITH_CLI=true \
#   GIT_CONFIG_COUNT=1 \
#   GIT_CONFIG_KEY_0="url.file:///home/luis/GitHub/handl-lang/kernel.insteadOf" \
#   GIT_CONFIG_VALUE_0="https://github.com/handl-lang/kernel" \
#   cargo check --workspace
#
# ADR-0149: `hnl` links exactly one sibling crate — the extension ABI. The
# tools it dispatches to are *not* dependencies; they are `libhnl_ext_*`
# shared libraries discovered at runtime.
[patch."https://github.com/handl-lang/kernel"]
handl-ext = { path = "../kernel/crates/handl-ext" }

# Match platform's dev profile: unoptimized (opt-level=0) builds overflow
# the default test-thread stack in engine-heavy unit tests.
[profile.dev]
opt-level = 1